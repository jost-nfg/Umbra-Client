# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric/Lunar Properties
# minecraft_version must match the Minecraft build that Lunar Client's 26.2 channel runs.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.2.0
maven_group=net.umbra
archives_base_name=Umbra

# Dependencies
netty_version=4.2.15.Final

# Sodium (compile-time only; Lunar Client provides Sodium at runtime)
# (https://github.com/CaffeineMC/sodium-fabric)
sodium_version=mc26.2-0.9.0-fabric
